name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pip install -e ".[agents]"
      - name: Syntax check
        run: python -m compileall -q swarmforge
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q

  yaml-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install -e ".[agents]"
      - name: Validate YAML workflow definitions
        run: |
          python -c "
import yaml
from pathlib import Path
for f in Path('examples').glob('*.yaml'):
    data = yaml.safe_load(f.read_text())
    assert 'name' in data, f'{f}: missing name'
    assert 'agents' in data, f'{f}: missing agents'
    assert 'steps' in data, f'{f}: missing steps'
    print(f'{f}: valid ({len(data[\"agents\"])} agents)')
print('All YAML definitions valid')
"
