[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "swarmforge"
version = "1.0.0"
description = "Visual multi-agent AI orchestrator - design, deploy, and monitor collaborative agent workflows"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "PlayNexus" }]
keywords = ["ai", "agents", "multi-agent", "orchestration", "llm", "workflows", "pydantic", "yaml"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "requests>=2.31.0",
    "rich>=13.0.0",
    "pyyaml>=6.0",
    "pydantic>=2.0.0",
    "click>=8.1.0",
    "aiohttp>=3.9.0",
    "httpx>=0.27.0",
    "tenacity>=8.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.1.0", "mypy>=1.5.0"]
agents = ["pydantic>=2.0.0", "aiohttp>=3.9.0", "httpx>=0.27.0", "tenacity>=8.2.0"]

[project.scripts]
swarmforge = "swarmforge.__main__:main"

[project.urls]
Homepage = "https://github.com/Nortaq-PlayNexus/swarmforge"
Repository = "https://github.com/Nortaq-PlayNexus/swarmforge"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.setuptools.packages.find]
include = ["swarmforge*"]
